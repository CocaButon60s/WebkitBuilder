name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      WPEWEBKIT: wpewebkit-2.52.3

    steps:
      - name: build libwpe
        env:
          LIBWPE: libwpe-1.16.3
        run: |
          wget https://wpewebkit.org/releases/${LIBWPE}.tar.xz
          tar xvf ${LIBWPE}.tar.xz

          sudo apt update
          sudo apt install -y libegl1-mesa-dev libgles2-mesa-dev libxkbcommon-dev

          cd ${LIBWPE}
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -GNinja
          ninja
          sudo ninja install

      - name: build wpebackend-fdo
        env:
          WPEBACKEND_FDO: wpebackend-fdo-1.16.1
        run: |
          wget https://wpewebkit.org/releases/${WPEBACKEND_FDO}.tar.xz
          tar xvf ${WPEBACKEND_FDO}.tar.xz

          sudo apt update
          sudo apt install -y meson ninja-build libwayland-dev libepoxy-dev

          cd ${WPEBACKEND_FDO}
          meson setup build
          ninja -C build
          sudo ninja -C build install

